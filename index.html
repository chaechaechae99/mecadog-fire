<style>

:root{--bg:#eceeec;--surface:#f8f9f8;--ink:#1c2220;--muted:#5b6662;--line:#c9d0cc;--accent:#d9a520;
  --font-sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}

:root[data-theme="dark"]{--bg:#131715;--surface:#1b201e;--ink:#e3e8e5;--muted:#97a39e;--line:#323b37;--accent:#e3b33a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.hub{max-width:1240px;margin:0 auto;display:grid;gap:14px}
.hub-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.hub-head .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hub-head h1{margin:2px 0 0;font-size:20px;font-weight:700;text-wrap:balance}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs a{font:inherit;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:6px;border:1px solid transparent}
nav.tabs a:hover{color:var(--ink);border-color:var(--line)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs a[aria-current="page"]{color:var(--bg);background:var(--ink)}
nav.tabs a span{font-family:var(--font-mono);font-size:11px;font-weight:600;margin-right:6px;opacity:.75}
.view{min-width:0}
</style>

</head>

<div class="hub">

  </div>

  </nav>
  <div class="view" id="v-plan1" hidden></div>
  <div class="view" id="v-plan2" hidden></div>
  <div class="view" id="v-dropped" hidden></div>
</div>

}}

*{box-sizing:border-box}

.flow > div:not(:last-child)::after{content:"→";position:absolute;right:-21px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}

.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
